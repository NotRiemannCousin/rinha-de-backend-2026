services:
  api1:
    image: rinha-api:latest
    command: ["/sockets/api1.sock"]
    volumes:
      - shared-sockets:/sockets
      - ./data:/data:ro
    deploy:
      resources:
        limits:
          cpus: "0.7"
          memory: "265MB"
    build:
      context: .
      dockerfile: Dockerfile.api

    security_opt:
      - seccomp=unconfined # Permite que o contêiner use a syscall da io_uring
    ulimits:
      memlock: -1        # Remove o limite de memória travada exigido pela io_uring
      nofile:
        soft: 65536      # Aumenta o limite de arquivos abertos (essencial para a rinha)
        hard: 65536

  api2:
    image: rinha-api:latest
    command: ["/sockets/api2.sock"]
    volumes:
      - shared-sockets:/sockets
      - ./data:/data:ro
    deploy:
      resources:
        limits:
          cpus: "0.7"
          memory: "265MB"
    build:
      context: .
      dockerfile: Dockerfile.api

    security_opt:
      - seccomp=unconfined # Permite que o contêiner use a syscall da io_uring
    ulimits:
      memlock: -1        # Remove o limite de memória travada exigido pela io_uring
      nofile:
        soft: 65536      # Aumenta o limite de arquivos abertos (essencial para a rinha)
        hard: 65536

  loadbalancer:
    image: rinha-lb:latest
    ports:
      - "9999:9999"
    volumes:
      - shared-sockets:/sockets
    depends_on:
      - api1
      - api2
    entrypoint: ["/bin/sh", "-c", "sleep 10 && /app/LoadBalancer"]
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "20MB"
    build:
      context: .
      dockerfile: Dockerfile.lb

    security_opt:
      - seccomp=unconfined # Permite que o contêiner use a syscall da io_uring
    ulimits:
      memlock: -1        # Remove o limite de memória travada exigido pela io_uring
      nofile:
        soft: 65536      # Aumenta o limite de arquivos abertos (essencial para a rinha)
        hard: 65536

volumes:
  shared-sockets: